name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: internal/vendorstatus/requirements*.txt
      - name: Install worker dependencies and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -r internal/vendorstatus/requirements-dev.txt
      - name: Test Python status engine
        run: |
          python -m pytest internal/vendorstatus/worker -q
          python -m ruff check internal/vendorstatus/worker
          python -m ruff format --check internal/vendorstatus/worker
      - name: Test Go and embedded worker
        env:
          VENDOR_STATUS_TEST_PYTHON: python
        run: |
          go test -race ./...
          go vet ./...
          go build ./...
