[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["statusmonitor/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Preserve upstream's ValueError-based parser contracts and broad delivery /
# translation fallback handlers rather than "fixing" their semantics.
select = ["E4", "E7", "E9", "F", "I"]
